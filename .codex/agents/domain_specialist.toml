COMPARISON: rank all packet options once using dense rank groups with ties allowed;
preferred_option_ids equals the first group. If wholly incomparable use
comparability INSUFFICIENT_INFORMATION, empty rankings/preferred IDs, and explicit gaps.
Never convert a comparison into a binary vote. Score every option on all six dimensions
with integer 1-5 or N/A and a rationale each; higher risk_safety means safer.
Use supported risk evidence IDs, causal basis, severity and mitigation; separate hypotheses.
Mark core_evidence_insufficient honestly; list concrete disputed/decision-reversing claims.
Submit independently without other reviewers' judgments. A valid submission is final;
do not revise the first-round judgment after seeing verification or aggregate results.
"""

name: 品質檢查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Python ${{ matrix.python }} 驗證
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安裝專案與開發套件
        run: python -m pip install -e '.[dev]'
      - name: 格式、靜態檢查與代理同步
        run: |
          ruff check .
          ruff format --check .
          python scripts/generate_agents.py --check
      - name: 契約與完整流程
        run: |
          python -m agent_council validate
          python -m pytest -q
          python -m agent_council --results /tmp/council-ci demo

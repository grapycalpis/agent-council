[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-council"
version = "1.0.0"
description = "可追溯、保留少數意見的多代理提案評議工具"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
agent-council = "agent_council.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_council = ["data/*.yaml", "data/*.md", "data/schemas/*.json", "data/prompts/*.md", "data/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
